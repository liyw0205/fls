name: Native backup regression

on:
  push:
    branches: [develop, main]
    paths:
      - 'fls_manager/**'
      - 'fls-manager.py'
      - 'fls.sh'
      - 'fls.ps1'
      - 'tests/**'
      - '.github/workflows/test-native-backup.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'fls_manager/**'
      - 'fls-manager.py'
      - 'fls.sh'
      - 'fls.ps1'
      - 'tests/**'
      - '.github/workflows/test-native-backup.yml'

permissions:
  contents: read

concurrency:
  group: native-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage_busy:
    name: ${{ matrix.os }} native storage busy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify native busy responses, unchanged data and saved-request recovery
        env:
          PYTHONPATH: .
          PYTHONUTF8: '1'
        run: >-
          python -m pytest -q tests/test_fixture_paths.py tests/test_native_storage_busy.py
          tests/test_native_env_api.py tests/test_native_config_api.py
          tests/test_native_proxy_api.py tests/test_native_notify_api.py
          tests/test_global_env_recovery.py tests/test_proxy_action_recovery.py
          tests/test_notify_action_recovery.py tests/test_config_apply_recovery.py
          tests/test_native_proxy_checks.py tests/test_native_notify_deliveries.py
          -W error::pytest.PytestUnhandledThreadExceptionWarning
  dependency_cleanup:
    name: ${{ matrix.os }} restore dependency cleanup across workers
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify original owner cleanup, failed receipts and worker crashes
        env:
          PYTHONPATH: .
          PYTHONUTF8: '1'
        run: >-
          python -m pytest -q tests/test_backup_dependency_cleanup_workers.py
          tests/test_backup_dependency_evidence.py
          tests/test_native_backup_api.py tests/test_backup_dependency_process.py
          tests/test_native_restore_identity.py
          -W error::pytest.PytestUnhandledThreadExceptionWarning
  sqlite_wal:
    name: ${{ matrix.os }} SQLite WAL during restore
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify real WAL data, interrupted commits and startup recovery
        env:
          PYTHONPATH: .
          PYTHONUTF8: '1'
        run: >-
          python -m pytest -q tests/test_backup_sqlite_wal.py
          tests/test_backup_directory_commit.py tests/test_native_backup_directory_recovery.py
          tests/test_backup_data_access.py
      - name: Verify data flushes, write-through moves and preparation failures
        env:
          PYTHONPATH: .
          PYTHONUTF8: '1'
        run: python -m pytest -q tests/test_backup_commit_durability.py
  instance_restore:
    name: ${{ matrix.os }} instance lock during restore
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify active instance identity during commit and rollback
        env:
          PYTHONPATH: .
          PYTHONUTF8: '1'
        run: >-
          python -m pytest -q tests/test_backup_instance_lock.py
          tests/test_fls_startup.py -k 'BackupInstanceLock or ManagerInstanceLock'
  log_cleanup:
    name: ${{ matrix.os }} native log cleanup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify durable cleanup, worker crash, fixed snapshots and legacy deletion
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q tests/test_native_log_cleanup.py
          tests/test_native_log_api.py tests/test_log_file_coordination.py
          tests/test_log_file_delete_recovery.py tests/test_log_group_delete_recovery.py
  install_commands:
    name: ${{ matrix.os }} dependency command supervision
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify supervised commands, owner crash, cancellation and log handoff
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_install_process.py
      - name: Verify detached daemon output, inherited writers and platform launcher
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_daemon_log.py
      - name: Verify existing dependency and runtime APIs and recovery
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q tests/test_deps_install_log_recovery.py
          tests/test_native_dependency_api.py tests/test_high_side_effect_workflows.py
          tests/test_runtime_status.py
          -k 'DependencyInstall or NativeDependencyApi or RuntimeStatus'
  linux:
    name: Linux backup API and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify native and existing backup workflows
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_backup_dependency_process.py
          tests/test_backup_activity_lease.py
          tests/test_backup_data_access.py
          tests/test_script_directory_jobs.py
          tests/test_script_directory_access.py
          tests/test_script_job_workers.py
          tests/test_script_debug_workers.py
          tests/test_native_script_debug_api.py
          tests/test_script_debug_recovery.py
          tests/test_task_config_directory_access.py
          tests/test_task_config_recovery.py
          tests/test_native_task_config.py
          tests/test_task_execution_workers.py
          tests/test_task_execution_recovery.py
          tests/test_task_runtime.py
          tests/test_task_copy_delete_recovery.py
          tests/test_task_log_directory_access.py
          tests/test_log_file_coordination.py
          tests/test_native_log_api.py
          tests/test_log_file_delete_recovery.py
          tests/test_log_group_delete_recovery.py
          tests/test_directory_process.py
          tests/test_online_install_directory_jobs.py
          tests/test_online_install_workers.py
          tests/test_online_install_lifecycle.py
          tests/test_online_install_recovery.py
          tests/test_online_install_storage_recovery.py
          tests/test_online_install_scheduler_recovery.py
          tests/test_online_native_api.py
          tests/test_online_task_validation.py
          tests/test_online_task_import_workers.py
          tests/test_online_task_import.py
          tests/test_online_task_import_replay.py
          tests/test_online_task_import_confirmation.py
          tests/test_online_task_import_retention.py
          tests/test_online_task_link_workers.py
          tests/test_online_task_link.py
          tests/test_online_refresh_workers.py
          tests/test_online_source_refresh.py
          tests/test_online_source_editor.py
          tests/test_online_source_api.py
          tests/test_online_refresh_storage_recovery.py
          tests/test_online_refresh_log.py
          tests/test_online_cache_storage_recovery.py
          tests/test_native_script_pull_api.py
          tests/test_native_script_repo_pull_api.py
          tests/test_native_script_import_api.py
          tests/test_native_script_files_api.py
          tests/test_script_file_recovery.py
          tests/test_script_import_recovery.py
          tests/test_ui_route_components.py
          tests/test_backup_directory_commit.py
          tests/test_native_backup_directory_recovery.py
          tests/test_native_directory_maintenance.py
          tests/test_native_directory_finalization.py
          tests/test_native_backup_api.py
          tests/test_native_restore_identity.py
          tests/test_backup_restore_recovery.py
          tests/test_backup_restore_idempotency.py
          tests/test_auth_backup.py
          tests/test_backup_request_recovery.py
          tests/test_backup_cancel_recovery.py
          tests/test_backup_file_recovery.py
          tests/test_backup_orphan_staging.py
          tests/test_backup_atomic_publication.py
          tests/test_backup_limits.py
          tests/test_storage_notify_proxy.py
          tests/test_history_native_api.py
          tests/test_history_performance.py
          tests/test_native_config_api.py
          tests/test_config_apply_recovery.py
          tests/test_native_proxy_checks.py
          tests/test_fls_startup.py
  windows_tasks:
    name: Windows task execution and receipts
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify ordinary task ownership, remote stops, retries and log lifetimes
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_task_execution_workers.py tests/test_task_log_directory_access.py
  windows:
    name: Windows dependency process tree and lease
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        id: test_dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify log handle leases, bounded reads and Web deletion compatibility
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_log_file_coordination.py tests/test_native_log_api.py tests/test_log_file_delete_recovery.py tests/test_log_group_delete_recovery.py
      - name: Verify Job Object ownership and crash cleanup
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        run: python -m pytest -q tests/test_backup_dependency_process.py
      - name: Verify independent process lease and receipt ordering
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_native_backup_api.py -k 'process_lease or rereads or preflight_stages or archive_target'
      - name: Verify shared backups and exclusive Web/native restore across workers
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_backup_activity_lease.py
      - name: Verify SQLite lifetimes and background storage during directory replacement
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_backup_data_access.py tests/test_auth_backup.py -k 'BackupDataAccess or native_login or native_logout or native_resend or native_totp'
      - name: Verify script job admission, handoff and cleanup against directory restore
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_directory_process.py tests/test_script_directory_jobs.py tests/test_script_directory_access.py tests/test_script_job_workers.py tests/test_native_script_repo_pull_api.py tests/test_native_script_import_api.py tests/test_script_import_recovery.py
      - name: Verify interrupted directory commit and startup recovery
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_backup_directory_commit.py tests/test_native_backup_directory_recovery.py tests/test_native_directory_maintenance.py tests/test_native_directory_finalization.py
      - name: Verify debug identity, remote stops and supervised process trees
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_script_debug_workers.py tests/test_native_script_debug_api.py tests/test_script_debug_recovery.py tests/test_ui_route_components.py -k 'debug or ScriptDebug'
      - name: Verify online install admission, command supervision and recovery
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_online_install_directory_jobs.py tests/test_online_install_workers.py tests/test_online_install_lifecycle.py tests/test_online_install_recovery.py tests/test_online_install_storage_recovery.py tests/test_online_install_scheduler_recovery.py tests/test_online_native_api.py tests/test_online_task_validation.py
      - name: Verify task config admission, bounded reads and publication cleanup
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_task_config_directory_access.py tests/test_native_task_config.py
      - name: Verify independent online task import identity and recovery across workers
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_online_task_import_workers.py tests/test_online_task_import.py tests/test_online_task_import_replay.py tests/test_online_task_import_confirmation.py tests/test_online_task_import_retention.py
      - name: Verify task-link identity, source publication and recovery across workers
        if: ${{ !cancelled() && steps.test_dependencies.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_online_task_link_workers.py tests/test_online_task_link.py tests/test_online_refresh_workers.py tests/test_online_source_refresh.py tests/test_online_source_editor.py tests/test_online_source_api.py tests/test_online_refresh_storage_recovery.py tests/test_online_refresh_log.py tests/test_online_cache_storage_recovery.py
