name: Native backup regression

on:
  push:
    branches: [develop, main]
    paths:
      - 'fls_manager/**'
      - 'fls-manager.py'
      - 'tests/**'
      - '.github/workflows/test-native-backup.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'fls_manager/**'
      - 'fls-manager.py'
      - 'tests/**'
      - '.github/workflows/test-native-backup.yml'

permissions:
  contents: read

concurrency:
  group: native-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux backup API and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify native and existing backup workflows
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_backup_dependency_process.py
          tests/test_backup_activity_lease.py
          tests/test_backup_data_access.py
          tests/test_script_directory_jobs.py
          tests/test_script_directory_access.py
          tests/test_script_job_workers.py
          tests/test_directory_process.py
          tests/test_online_install_directory_jobs.py
          tests/test_online_install_workers.py
          tests/test_online_install_lifecycle.py
          tests/test_online_install_recovery.py
          tests/test_online_install_storage_recovery.py
          tests/test_online_install_scheduler_recovery.py
          tests/test_online_native_api.py
          tests/test_online_task_validation.py
          tests/test_online_task_import_workers.py
          tests/test_online_task_import.py
          tests/test_online_task_import_replay.py
          tests/test_online_task_import_confirmation.py
          tests/test_online_task_import_retention.py
          tests/test_online_task_link_workers.py
          tests/test_online_task_link.py
          tests/test_online_refresh_workers.py
          tests/test_online_source_refresh.py
          tests/test_online_source_editor.py
          tests/test_online_source_api.py
          tests/test_online_refresh_storage_recovery.py
          tests/test_online_refresh_log.py
          tests/test_online_cache_storage_recovery.py
          tests/test_native_script_pull_api.py
          tests/test_native_script_repo_pull_api.py
          tests/test_native_script_import_api.py
          tests/test_native_script_files_api.py
          tests/test_script_file_recovery.py
          tests/test_script_import_recovery.py
          tests/test_ui_route_components.py
          tests/test_backup_directory_commit.py
          tests/test_native_backup_directory_recovery.py
          tests/test_native_backup_api.py
          tests/test_native_restore_identity.py
          tests/test_backup_restore_recovery.py
          tests/test_backup_restore_idempotency.py
          tests/test_auth_backup.py
          tests/test_backup_request_recovery.py
          tests/test_backup_cancel_recovery.py
          tests/test_backup_file_recovery.py
          tests/test_backup_orphan_staging.py
          tests/test_backup_atomic_publication.py
          tests/test_backup_limits.py
          tests/test_storage_notify_proxy.py
          tests/test_history_native_api.py
          tests/test_history_performance.py
          tests/test_native_config_api.py
          tests/test_config_apply_recovery.py
          tests/test_native_proxy_checks.py
          tests/test_fls_startup.py
  windows:
    name: Windows dependency process tree and lease
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask 'APScheduler<4' requests PySocks tzdata qrcode pytest pytest-subtests
      - name: Verify Job Object ownership and crash cleanup
        run: python -m pytest -q tests/test_backup_dependency_process.py
      - name: Verify independent process lease and receipt ordering
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_native_backup_api.py -k 'process_lease or rereads or preflight_stages or archive_target'
      - name: Verify shared backups and exclusive Web/native restore across workers
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_backup_activity_lease.py
      - name: Verify SQLite lifetimes and background storage during directory replacement
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_backup_data_access.py tests/test_auth_backup.py -k 'BackupDataAccess or native_login or native_logout or native_resend or native_totp'
      - name: Verify script job admission, handoff and cleanup against directory restore
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_directory_process.py tests/test_script_directory_jobs.py tests/test_script_directory_access.py tests/test_script_job_workers.py tests/test_native_script_repo_pull_api.py tests/test_native_script_import_api.py tests/test_script_import_recovery.py
      - name: Verify interrupted directory commit and startup recovery
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_backup_directory_commit.py tests/test_native_backup_directory_recovery.py
      - name: Verify online install admission, command supervision and recovery
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_online_install_directory_jobs.py tests/test_online_install_workers.py tests/test_online_install_lifecycle.py tests/test_online_install_recovery.py tests/test_online_install_storage_recovery.py tests/test_online_install_scheduler_recovery.py tests/test_online_native_api.py tests/test_online_task_validation.py
      - name: Verify independent online task import identity and recovery across workers
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_online_task_import_workers.py tests/test_online_task_import.py tests/test_online_task_import_replay.py tests/test_online_task_import_confirmation.py tests/test_online_task_import_retention.py
      - name: Verify task-link identity, source publication and recovery across workers
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_online_task_link_workers.py tests/test_online_task_link.py tests/test_online_refresh_workers.py tests/test_online_source_refresh.py tests/test_online_source_editor.py tests/test_online_source_api.py tests/test_online_refresh_storage_recovery.py tests/test_online_refresh_log.py tests/test_online_cache_storage_recovery.py
