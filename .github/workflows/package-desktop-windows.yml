name: Package Windows desktop release

on:
  workflow_dispatch:
  push: {}

permissions:
  contents: write

env:
  DESKTOP_ZIP: fls-manager-desktop-windows-x64.zip
  DESKTOP_CHECKSUMS: SHA256SUMS-windows-desktop

jobs:
  version-check:
    name: Check version.json changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version.json change
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            if git rev-parse --verify "${after}^" >/dev/null 2>&1; then
              before="${after}^"
            else
              before=""
            fi
          fi

          if [[ -z "$before" ]]; then
            changed=true
          elif git diff --quiet "$before" "$after" -- version.json; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "version.json changed: $changed"

  package-windows:
    name: Package Windows x64 desktop archive
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and validate package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $info = Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([int]$info.versionCode -lt 1 -or [string]::IsNullOrWhiteSpace([string]$info.version)) {
            throw "version.json 的 version/versionCode 无效"
          }
          if (-not (Test-Path changelog.md)) { throw "changelog.md 缺失" }

          $staging = Join-Path $env:RUNNER_TEMP "fls-desktop-staging"
          $archive = Join-Path $env:RUNNER_TEMP "fls-source.tar"
          Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
          Remove-Item -Force $archive, $env:DESKTOP_ZIP, $env:DESKTOP_CHECKSUMS -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          git archive HEAD -o $archive
          tar -xf $archive -C $staging

          foreach ($path in @(".git", ".github", ".tmp", ".venv", "data", "log", "logs", "tests", "tools", "packaging", "docs", "install.sh", "__pycache__", ".pytest_cache")) {
            $target = Join-Path $staging $path
            if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          }

          foreach ($path in @("fls.ps1", "fls.bat", "install.ps1", "fls-manager.py", "fls_manager", "README.md", "version.json", "changelog.md")) {
            if (-not (Test-Path (Join-Path $staging $path))) { throw "发布包缺少 $path" }
          }

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $staging "install.ps1"), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "install.ps1 PowerShell 语法检查失败" }
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $staging "fls.ps1"), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "fls.ps1 PowerShell 语法检查失败" }

      - name: Test packaged installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = Join-Path $env:RUNNER_TEMP "fls-desktop-staging"
          $testDir = Join-Path $env:RUNNER_TEMP "fls-desktop-installed"
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          & pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $staging "install.ps1") -InstallDir $testDir -NoStart
          if ($LASTEXITCODE -ne 0) { throw "发布包安装测试失败" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $testDir "fls.ps1") status
          if ($LASTEXITCODE -ne 0) { throw "安装后的 fls.ps1 status 测试失败" }
          foreach ($path in @("fls-manager.py", "fls_manager", "fls.ps1", "fls.bat", ".venv\Scripts\python.exe", "data", "log", "scripts")) {
            if (-not (Test-Path (Join-Path $testDir $path))) { throw "安装结果缺少 $path" }
          }

          try {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $testDir "fls.ps1") start
            if ($LASTEXITCODE -ne 0) { throw "安装后的 FLS 启动失败" }
            $healthy = $false
            for ($i = 0; $i -lt 15; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:5700/" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw "安装后的 FLS 面板健康检查失败" }
          } finally {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $testDir "fls.ps1") stop
          }

      - name: Create desktop ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = Join-Path $env:RUNNER_TEMP "fls-desktop-staging"
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $env:DESKTOP_ZIP -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:DESKTOP_ZIP))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @("fls.ps1", "fls.bat", "install.ps1", "fls-manager.py", "version.json", "changelog.md")) {
              if ($names -notcontains $required) { throw "ZIP 缺少 $required" }
            }
            $unsafe = @($names | Where-Object { $_.StartsWith("/") -or $_.Split("/") -contains ".." -or $_.ToLower().EndsWith(".zip") })
            if ($unsafe.Count -gt 0) { throw "ZIP 包含不安全或嵌套压缩条目：$($unsafe -join ', ')" }
          } finally {
            $zip.Dispose()
          }

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:DESKTOP_ZIP -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:DESKTOP_ZIP" | Set-Content -Path $env:DESKTOP_CHECKSUMS -Encoding ASCII

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: fls-manager-desktop-windows-x64
          path: |
            ${{ env.DESKTOP_ZIP }}
            ${{ env.DESKTOP_CHECKSUMS }}
          if-no-files-found: error

  release:
    name: Publish Windows desktop release
    needs: package-windows
    if: >-
      needs.package-windows.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(json.load(open("version.json", encoding="utf-8"))["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            test "${tag#v}" = "$expected" || {
              echo "tag version (${tag#v}) must match version.json ($expected)" >&2
              exit 1
            }
          else
            tag="v$expected"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing release $tag"

      - name: Prepare version-specific release notes
        shell: bash
        run: python3 tools/release_notes.py --output release-notes.md

      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: fls-manager-desktop-windows-x64
          path: dist

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FLS Manager ${{ steps.release.outputs.tag }} (Windows)
          body_path: release-notes.md
          overwrite_files: true
          files: |
            dist/fls-manager-desktop-windows-x64.zip
            dist/${{ env.DESKTOP_CHECKSUMS }}
