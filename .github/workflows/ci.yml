name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-performance:
    name: Tests and bounded performance regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check flask apscheduler requests PySocks pytest

      - name: Run bounded test suite
        run: python3 -m pytest -q

      - name: Compile Python modules
        run: python3 -m compileall -q fls_manager tools

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in fls.sh fls-a.sh fls-t.sh tools/run_performance_benchmark.sh packaging/magisk/*.sh; do
            sh -n "$script"
          done

      - name: Check diff whitespace
        run: git diff --check

      - name: Run locked 10k API benchmark
        shell: bash
        run: |
          set -euo pipefail
          tools/run_performance_benchmark.sh --mode optimized --iterations 12 --check > /tmp/fls-performance-ci.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/fls-performance-ci.json').read_text())
          assert report['fixture']['history_rows'] == 10_000
          assert report['fixture']['task_rows'] == 100
          assert report['lock'] == 'flock -w 600 /tmp/nonebot-project-validation.lock'
          assert all(item['errors'] == 0 for item in report['measurements'])
          assert all(item['rss_peak_mb'] <= 128 for item in report['measurements'])
          assert report['thresholds']['p95_ms']['search'] == 15.0
          PY
