name: Package KernelSU Magisk module

on:
  workflow_dispatch:
  push: {}

permissions:
  contents: write

env:
  MODULE_ZIP: fls-manager-module.zip

jobs:
  version-check:
    name: Check version.json changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version.json change
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: package the current version."
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            if git rev-parse --verify "${after}^" >/dev/null 2>&1; then
              before="${after}^"
            else
              before=""
            fi
          fi

          if [[ -z "$before" ]]; then
            changed=true
          elif git diff --quiet "$before" "$after" -- version.json; then
            changed=false
          else
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "version.json changed: $changed"

  package-module:
    name: Package fls-manager-module.zip
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare module staging directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("version.json").read_text(encoding="utf-8"))
          if not isinstance(info.get("versionCode"), int) or info["versionCode"] < 1:
              raise SystemExit("version.json.versionCode must be a positive integer")
          if not isinstance(info.get("version"), str) or not info["version"].strip():
              raise SystemExit("version.json.version must be a non-empty string")
          for key in ("zipUrl", "changelog"):
              if not isinstance(info.get(key), str) or not info[key].strip():
                  raise SystemExit(f"version.json.{key} must be a non-empty string")
          if not Path("changelog.md").is_file():
              raise SystemExit("changelog.md is missing")
          PY

          rm -rf staging "$MODULE_ZIP"
          mkdir -p staging/fls

          # Keep module files at the ZIP root. The fls/ directory is the
          # bundled program source, not another archive or installable module.
          git archive HEAD | tar -x -C staging/fls
          rm -rf staging/fls/.github \
                 staging/fls/.git \
                 staging/fls/docs \
                 staging/fls/tests \
                 staging/fls/tools \
                 staging/fls/packaging \
                 staging/fls/.tmp \
                 staging/fls/.pytest_cache \
                 staging/fls/__pycache__
          rm -f staging/fls/version.json staging/fls/changelog.md

          cp version.json changelog.md staging/
          cp packaging/magisk/module.prop \
             packaging/magisk/customize.sh \
             packaging/magisk/service.sh \
             packaging/magisk/uninstall.sh \
             packaging/magisk/action.sh \
             packaging/magisk/runtime.sh \
             packaging/magisk/runtime.env \
             packaging/magisk/fls-a.sh staging/
          cp fls-t.sh staging/fls-t.sh
          cp -R packaging/magisk/webroot staging/webroot

          python3 - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("version.json").read_text(encoding="utf-8"))
          template = Path("staging/module.prop").read_text(encoding="utf-8").splitlines()
          fields = {
              "version": str(info["version"]),
              "versionCode": str(info["versionCode"]),
          }
          output = []
          seen = set()
          for line in template:
              key = line.split("=", 1)[0]
              if key in fields:
                  output.append(f"{key}={fields[key]}")
                  seen.add(key)
              else:
                  output.append(line)
          for key in fields:
              if key not in seen:
                  output.append(f"{key}={fields[key]}")
          Path("staging/module.prop").write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

          chmod 0755 staging/*.sh

      - name: Validate module staging
        shell: bash
        run: |
          set -euo pipefail
          test -s staging/module.prop
          test -s staging/version.json
          test -s staging/changelog.md
          test -s staging/customize.sh
          test -s staging/action.sh
          test -s staging/fls-t.sh
          test -f staging/webroot/index.html
          test -f staging/fls/fls-manager.py
          test -f staging/fls/fls.sh
          grep -Eq '^id=fls-manager$' staging/module.prop
          grep -Eq '^version=[^[:space:]]+$' staging/module.prop
          grep -Eq '^versionCode=[1-9][0-9]*$' staging/module.prop
          grep -Eq '^updateJson=https://raw.githubusercontent.com/liyw0205/fls/main/version.json$' staging/module.prop
          grep -Eq '^FLS_RUNTIME_TAG=proot-runtime$' staging/runtime.env
          for script in staging/*.sh; do
            sh -n "$script"
          done
          ! find staging -type f -name '*.zip' -print -quit | grep -q .

      - name: Create module ZIP
        shell: bash
        run: |
          set -euo pipefail
          (
            cd staging
            zip -r -9 "../$MODULE_ZIP" .
          )

          python3 - "$MODULE_ZIP" <<'PY'
          import sys
          import zipfile

          required = {
              "module.prop",
              "customize.sh",
              "service.sh",
              "uninstall.sh",
              "action.sh",
              "fls-t.sh",
              "runtime.sh",
              "runtime.env",
              "version.json",
              "changelog.md",
              "fls/fls-manager.py",
              "fls/fls.sh",
              "webroot/index.html",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              missing = required - names
              unsafe = [name for name in names if name.startswith("/") or ".." in name.split("/")]
              nested = [name for name in names if name.lower().endswith(".zip") or name.startswith("payload/")]
              if missing:
                  raise SystemExit(f"missing module entries: {sorted(missing)}")
              if unsafe:
                  raise SystemExit(f"unsafe ZIP entries: {unsafe}")
              if nested:
                  raise SystemExit(f"nested module archives are not allowed: {nested}")
          PY

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: fls-manager-module
          path: ${{ env.MODULE_ZIP }}
          if-no-files-found: error

  release:
    name: Publish module release
    runs-on: ubuntu-latest
    needs: package-module
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected="$(python3 -c 'import json; print(json.load(open("version.json", encoding="utf-8"))["version"])')"
          test "$version" = "$expected" || {
            echo "tag version ($version) must match version.json ($expected)" >&2
            exit 1
          }

      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: fls-manager-module
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FLS Manager ${{ github.ref_name }}
          body_path: changelog.md
          files: dist/fls-manager-module.zip
