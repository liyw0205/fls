name: Build KernelSU Magisk module

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MODULE_ZIP: fls-manager-module.zip

jobs:
  build-runtime:
    name: Build ${{ matrix.profile }} runtime (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            termux_arch: aarch64
            profile: python
          - arch: arm64
            platform: linux/arm64
            termux_arch: aarch64
            profile: all
          - arch: armv7
            platform: linux/arm/v7
            termux_arch: arm
            profile: python
          - arch: armv7
            platform: linux/arm/v7
            termux_arch: arm
            profile: all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable cross-architecture emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Build proot runtime archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bash packaging/proot/build-runtime.sh \
            --arch "${{ matrix.arch }}" \
            --platform "${{ matrix.platform }}" \
            --termux-arch "${{ matrix.termux_arch }}" \
            --profile "${{ matrix.profile }}" \
            --output "dist/fls-proot-${{ matrix.profile }}-${{ matrix.arch }}.tar.gz"

      - name: Validate runtime archive
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/fls-proot-${{ matrix.profile }}-${{ matrix.arch }}.tar.gz"
          test -s "$archive"
          tar -tzf "$archive" | grep -Fx 'bin/proot'
          tar -tzf "$archive" | grep -Fx 'rootfs/usr/bin/python3'
          tar -tzf "$archive" | grep -Fx 'rootfs/opt/fls-venv/bin/python'

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: fls-proot-${{ matrix.profile }}-${{ matrix.arch }}
          path: dist/fls-proot-${{ matrix.profile }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  package-module:
    name: Package module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare module staging directory
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("version.json").read_text(encoding="utf-8"))
          required = ("versionCode", "version", "zipUrl", "changelog")
          missing = [key for key in required if not info.get(key)]
          if missing or not isinstance(info["versionCode"], int):
              raise SystemExit(f"invalid version.json, missing: {missing}")
          if not Path("changelog.md").is_file():
              raise SystemExit("changelog.md is missing")
          PY

          rm -rf staging "$MODULE_ZIP"
          mkdir -p staging/payload/fls

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag must contain a semantic version, got: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            runtime_tag="$GITHUB_REF_NAME"
          else
            version="0.0.0-${GITHUB_RUN_NUMBER}"
            runtime_tag="latest"
          fi

          sed \
            -e "s/^version=.*/version=${version}/" \
            -e "s/^versionCode=.*/versionCode=${GITHUB_RUN_NUMBER}/" \
            packaging/magisk/module.prop > staging/module.prop

          # Keep runtime data and user scripts outside the module source snapshot.
          git archive HEAD | tar -x -C staging/payload/fls
          rm -rf staging/payload/fls/.github \
                 staging/payload/fls/.git \
                 staging/payload/fls/docs \
                 staging/payload/fls/tests \
                 staging/payload/fls/tools \
                 staging/payload/fls/packaging

          cp packaging/magisk/fls-a.sh packaging/magisk/service.sh packaging/magisk/uninstall.sh staging/
          printf 'FLS_RELEASE_REPO=%s\nFLS_RELEASE_TAG=%s\n' "$GITHUB_REPOSITORY" "$runtime_tag" > staging/runtime.env
          chmod 0755 staging/fls-a.sh staging/service.sh staging/uninstall.sh

      - name: Validate module files
        shell: bash
        run: |
          set -euo pipefail
          test -s staging/module.prop
          grep -Eq '^id=fls-manager$' staging/module.prop
          grep -Eq '^version=[^[:space:]]+$' staging/module.prop
          grep -Eq '^versionCode=[0-9]+$' staging/module.prop
          grep -Eq '^FLS_RELEASE_TAG=(latest|v[0-9])' staging/runtime.env
          for script in staging/fls-a.sh staging/service.sh staging/uninstall.sh; do
            sh -n "$script"
          done
          test -f staging/payload/fls/fls-manager.py
          test -f staging/payload/fls/fls.sh

      - name: Create module ZIP
        shell: bash
        run: |
          set -euo pipefail
          (
            cd staging
            zip -r -9 "../$MODULE_ZIP" .
          )

          python3 - "$MODULE_ZIP" <<'PY'
          import sys
          import zipfile

          required = {
              "module.prop",
              "runtime.env",
              "fls-a.sh",
              "service.sh",
              "uninstall.sh",
              "payload/fls/fls-manager.py",
              "payload/fls/fls.sh",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              missing = required - names
              unsafe = [name for name in names if name.startswith("/") or ".." in name.split("/")]
              if missing:
                  raise SystemExit(f"missing module entries: {sorted(missing)}")
              if unsafe:
                  raise SystemExit(f"unsafe ZIP entries: {unsafe}")
          PY

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: fls-manager-module
          path: ${{ env.MODULE_ZIP }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-runtime, package-module]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fls-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FLS Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            fls-manager-module.zip
            fls-proot-python-arm64.tar.gz
            fls-proot-all-arm64.tar.gz
            fls-proot-python-armv7.tar.gz
            fls-proot-all-armv7.tar.gz
