<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FLS Manager</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #10141c;
      color: #eef2f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px 16px; background: #10141c; }
    main { width: min(100%, 620px); margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    p { color: #aeb8c6; line-height: 1.55; }
    .panel {
      margin-top: 22px;
      padding: 18px;
      border: 1px solid #2c3645;
      border-radius: 8px;
      background: #171d27;
    }
    .fields { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 12px; }
    label { display: grid; gap: 7px; color: #cbd5e1; font-size: .9rem; }
    input {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid #465466;
      border-radius: 6px;
      background: #0f141c;
      color: #f8fafc;
      font: inherit;
    }
    input:focus { outline: 2px solid #60a5fa; outline-offset: 1px; border-color: #60a5fa; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
    .open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 650;
    }
    .open:hover { background: #1d4ed8; }
    .reset {
      width: 42px;
      height: 42px;
      border: 1px solid #465466;
      border-radius: 6px;
      background: #202938;
      color: #dbeafe;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
    }
    .reset:hover { background: #2d3a4d; }
    .hint { min-height: 1.4em; margin: 10px 0 0; color: #93c5fd; font-size: .88rem; }
    code { color: #dbeafe; overflow-wrap: anywhere; }
    @media (max-width: 420px) {
      body { padding: 18px 12px; }
      .fields { grid-template-columns: 1fr; }
      .panel { padding: 15px; }
      .open { flex: 1 1 190px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>FLS Manager</h1>
    <p>设置 FLS 面板的访问地址。配置只保存在当前浏览器，不会修改模块文件。</p>
    <section class="panel" aria-labelledby="endpoint-title">
      <h2 id="endpoint-title" style="margin:0 0 14px;font-size:1.1rem">面板地址</h2>
      <div class="fields">
        <label for="host">IP 或域名
          <input id="host" name="host" autocomplete="url" inputmode="url" spellcheck="false" placeholder="127.0.0.1">
        </label>
        <label for="port">端口
          <input id="port" name="port" type="number" min="1" max="65535" inputmode="numeric" placeholder="5700">
        </label>
      </div>
      <div class="actions">
        <a id="open-panel" class="open" href="http://127.0.0.1:5700" target="_blank" rel="noopener">打开 FLS 面板</a>
        <button id="reset-endpoint" class="reset" type="button" title="恢复默认 IP 和端口" aria-label="恢复默认 IP 和端口">&#8634;</button>
      </div>
      <p id="endpoint-status" class="hint" role="status" aria-live="polite"></p>
    </section>
    <p>模块数据与运行时保存在 <code>/data/fls</code>；Termux 模式的运行时保存在 <code>$HOME/.fls-runtime</code>。</p>
  </main>
  <script>
    (() => {
      const DEFAULT_HOST = "127.0.0.1";
      const DEFAULT_PORT = "5700";
      const STORAGE_KEY = "fls-panel-endpoint";
      const hostInput = document.getElementById("host");
      const portInput = document.getElementById("port");
      const openLink = document.getElementById("open-panel");
      const status = document.getElementById("endpoint-status");

      function loadEndpoint() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (saved && typeof saved.host === "string" && typeof saved.port === "string") {
            return { host: saved.host, port: saved.port };
          }
        } catch (_) { /* Ignore unavailable or malformed browser storage. */ }
        return { host: DEFAULT_HOST, port: DEFAULT_PORT };
      }

      function normalizeHost(value) {
        let host = String(value || "").trim();
        host = host.replace(/^https?:\/\//i, "").split(/[/?#]/, 1)[0];
        return host.replace(/^\[|\]$/g, "");
      }

      function endpoint() {
        const host = normalizeHost(hostInput.value);
        const port = String(portInput.value || "").trim();
        if (!host) throw new Error("请输入 IP 或域名");
        if (!/^\d+$/.test(port) || Number(port) < 1 || Number(port) > 65535) {
          throw new Error("端口必须是 1-65535 的数字");
        }
        const displayHost = host.includes(":") ? `[${host}]` : host;
        return { host, port, url: `http://${displayHost}:${port}` };
      }

      function saveEndpoint() {
        try {
          const value = endpoint();
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ host: value.host, port: value.port }));
          openLink.href = value.url;
          status.textContent = `当前地址：${value.url}`;
          status.style.color = "#93c5fd";
        } catch (error) {
          openLink.href = "#";
          status.textContent = error.message;
          status.style.color = "#fca5a5";
        }
      }

      function resetEndpoint() {
        hostInput.value = DEFAULT_HOST;
        portInput.value = DEFAULT_PORT;
        saveEndpoint();
      }

      const saved = loadEndpoint();
      hostInput.value = saved.host;
      portInput.value = saved.port;
      hostInput.addEventListener("input", saveEndpoint);
      portInput.addEventListener("input", saveEndpoint);
      document.getElementById("reset-endpoint").addEventListener("click", resetEndpoint);
      openLink.addEventListener("click", (event) => {
        saveEndpoint();
        if (openLink.getAttribute("href") === "#") event.preventDefault();
      });
      saveEndpoint();
    })();
  </script>
</body>
</html>
